# taupkg manifest for Nebula.
#
#   taupkg install          fetch + build every dependency below
#   taupkg build            build cli/nebula.tr -> the `nebula` CLI
#   taupkg run -- routes    build it and run `nebula routes`
#   taupkg env              print the TAURARO_PATH line, to run tauraroc by hand
#   taupkg tree             show the resolved dependency graph
#
# Going through taupkg rather than calling tauraroc directly is worth it for
# one reason above all: `build`/`run`/`test` set TAURARO_PATH themselves.
# Getting that wrong by hand is what makes a checkout fail to build with an
# error naming a symbol rather than a missing package.

[package]
name    = "nebula"
version = "0.1.0"
desc    = "A cross-platform GUI engine with its own declarative UI syntax, written in Tauraro"
license = "MIT"
bin     = "cli/nebula.tr"

# --- dependencies ----------------------------------------------------------
#
# Nebula's external surface is deliberately tiny. Every import across
# toolkit/, cli/ and examples/ resolves to one of:
#
#   toolkit.*                    this repo
#   cli.* / app.*                this repo / the user's own app
#   string, io, core, sys, math  the Tauraro stdlib, shipped inside tauraroc
#   tausvg                       the ONLY third-party package  <-- below
#
# That is the whole list, taken from the imports rather than from memory.
# Nothing else needs declaring, and `taupkg install` on a fresh clone
# currently has nothing to fetch.

[deps]
# Pure-Tauraro SVG-subset rasterizer, used by cli/nebula.tr's bake_images()
# to turn an `.svg` under a project's `assets = ...` into a baked RGBA
# module at build time. No system/native dependency -- which is the reason
# it exists rather than shelling out to a converter.
#
# `branch = "master"` is explicit because that is the repo's default and
# taupkg should not have to guess (and because a later switch to `main`
# would otherwise silently change what gets resolved).
#
# PNG/JPG assets do NOT go through this -- they use scripts/bake-image.ps1's
# GDI+ pipeline and need no package at all.
tausvg = { git = "https://github.com/Yusee-Programmer/tausvg", branch = "master" }

# --- optional features -----------------------------------------------------
#
# SVG assets. `cli/nebula.tr`'s bake_images() rasterizes an `.svg` under a
# project's `assets = ...` directory in-process, via tausvg. PNG/JPG assets
# do NOT go through this -- they use scripts/bake-image.ps1's GDI+ pipeline
# and need no package at all.
#
# NOT ENABLED BY DEFAULT, and not in [deps], because tausvg cannot be
# resolved from anywhere today. The intended home is
# github.com/Yusee-Programmer/tausvg; as of 2026-09-22 that repository
# does not exist yet. Checked, rather than assumed:
#
#   * `git ls-remote https://github.com/Yusee-Programmer/tausvg` ->
#     "Repository not found";
#   * that is NOT an access problem. The same command against the sibling
#     package `Yusee-Programmer/templa` succeeds from this machine with
#     the same credentials, so a private repo the local git account could
#     see would have resolved. It is unpushed, not hidden;
#   * `tauraro/tausvg` is 404 too, as are tau-svg / tausvg2 / svg /
#     tauimage / taugfx under both accounts;
#   * a GitHub-wide repository search for "tausvg" returns zero results;
#   * taupkg's registry host (registry.taupkg.dev) does not resolve in
#     DNS, so search/add fail with HTTP 0 and cannot supply it either;
#   * and a recursive search of this machine finds nothing named tausvg.
#
# TO ENABLE, once the repo is pushed -- uncomment the two blocks below and:
#
#     taupkg install
#     taupkg build            # or: taupkg build --features svg
#
# Declaring a git dep pointing at a URL that 404s would make `taupkg
# install` fail for EVERY user, which is strictly worse than not declaring
# it. So the line below is the intended shape, left commented until the
# repo exists -- uncomment it and drop the `optional` to make SVG assets a
# hard requirement, or enable it per-build with:
#
#     taupkg build --features svg
#
# [deps]
# tausvg = { git = "https://github.com/Yusee-Programmer/tausvg", optional = true }
#
# [features]
# svg = ["tausvg"]
#
# CONSEQUENCE while this stands: cli/nebula.tr imports tausvg
# unconditionally, so the CLI builds only where tausvg already happens to
# be installed. Verified as the single blocker -- with TAURARO_PATH unset,
# the one error is `rasterize_svg_file` undefined at cli/nebula.tr:427.
# Making that import conditional (so the CLI builds everywhere and SVG
# baking degrades to a warning) is a code change, not a manifest one.

# --- future ----------------------------------------------------------------
#
# templa (github.com/Yusee-Programmer/templa) is the project's chosen
# templating engine -- see CLAUDE.md, where Jinja was proposed and
# explicitly rejected in its favour. Intentionally NOT declared yet: no
# module imports it, and a dependency nothing uses is one more thing to
# install and keep current for no benefit. Add it in the same commit that
# first imports it.
